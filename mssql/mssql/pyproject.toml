[project]
name = "mssql"
version = "0.0.1"
description = "OpenGraph collector for Microsoft SQL Server attack paths using OpenHound"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
authors = [
  {name = "Chris Thompson (@_Mayyhem)", email = "cthompson@specterops.io"}
]
dependencies = [
    # Shared pure-Python collector infrastructure (TDS/NTLM/Kerberos/EPA, LDAP/AD, WMI,
    # DNS discovery, SOCKS5, DLT bridges, logging, graph stubs). Carries impacket/ldap3/
    # pywin32/etc. transitively — see ../../openhound-collector-common.
    "openhound-collector-common",
]

[tool.uv.sources]
openhound-collector-common = { path = "../../openhound-collector-common", editable = true }

[tool.uv]
# Prefer system / official Pythons over uv-managed (python-build-standalone) on Windows:
# their libcrypto-3-x64.dll lacks the OPENSSL_Applink cross-CRT shim, so any TLS handshake
# aborts the process. Mirrors the SCCM extension. Harmless on Linux.
python-preference = "only-system"

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["src/openhound_mssql"]

[tool.hatch.build.targets.wheel.force-include]
"extension.yaml" = "openhound_mssql/extension.yaml"

[dependency-groups]
dev = [
    "openhound @ git+https://github.com/SpecterOps/openhound.git",
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
    "zensical>=0.0.27",
]

[project.entry-points."openhound.sources"]
mssql = "openhound_mssql.main:app"
