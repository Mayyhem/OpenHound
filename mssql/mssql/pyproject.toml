[project]
name = "mssql"
version = "0.0.1"
description = "OpenGraph collector for mssql using OpenHound"
readme = "README.md"
requires-python = "<=3.14,>=3.13"
authors = [
  {name = "Chris Thompson (@_Mayyhem)", email = "cthompson@specterops.io"}
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel.force-include]
"extension.yaml" = "openhound_mssql/extension.yaml"

[dependency-groups]
dev = [
    "openhound @ git+https://github.com/SpecterOps/openhound.git",
    "pre-commit>=4.5.1",
    "pytest>=9.0.1",
    "ruff>=0.15.5",
    "mypy>=1.19.1",
    "zensical>=0.0.27",
]

[project.entry-points."openhound.sources"]
mssql = "openhound_mssql.main:app"
